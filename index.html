<!doctype html>
<html lang="id" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4EFE4" />
    <meta
      name="description"
      content="Tinta — ruang menulis lokal-first dengan simpan otomatis, riwayat, buku dan bab, Markdown, serta ekspor. Semua fitur terbuka, gratis selamanya."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231F6B5A'/%3E%3Cpath d='M16 6.5c4.2 5.2 6.4 8.4 6.4 11.5a6.4 6.4 0 1 1-12.8 0c0-3.1 2.2-6.3 6.4-11.5z' fill='%23FBF7EE'/%3E%3Cpath d='M13.4 18.2c0 1.7 1.4 3 3.1 3' stroke='%231F6B5A' stroke-width='1.1' stroke-linecap='round' fill='none'/%3E%3C/svg%3E"
    />
    <title>Tinta — menulis tanpa kehilangan</title>
    <script>
      try {
        var saved = localStorage.getItem("tinta.v1");
        if (saved) {
          var parsed = JSON.parse(saved);
          if (parsed && parsed.settings && parsed.settings.theme) {
            document.documentElement.dataset.theme = parsed.settings.theme;
          }
        }
      } catch (error) {
        /* first run */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
