name: Android build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install SDK packages
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan di $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 5 -type d 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug --no-daemon --stacktrace

      - name: Prepare artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/out/tinta-android-1.0.0-debug.apk"
          cd "$RUNNER_TEMP/out"
          sha256sum tinta-android-1.0.0-debug.apk > SHA256SUMS.txt
          git -C "$GITHUB_WORKSPACE" archive \
            --format=zip \
            --output="$RUNNER_TEMP/out/tinta-1.0.0-source.zip" \
            HEAD

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: tinta-android-debug
          path: |
            ${{ runner.temp }}/out/tinta-android-1.0.0-debug.apk
            ${{ runner.temp }}/out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: tinta-source
          path: ${{ runner.temp }}/out/tinta-1.0.0-source.zip
          if-no-files-found: error
          retention-days: 30
